[General]
network = RingNetwork
sim-time-limit = 1000s
cpu-time-limit = 300s
seed-set = ${repetition}
num-rngs = 1
debug-on-errors = true
print-undisposed = true
**.vector-recording = true
**.scalar-recording = true

[Config Small]
description = "Ring routing with 8 clients"
RingNetwork.N = 8
RingNetwork.K = 64
RingNetwork.X = 16
RingNetwork.topoFile = "config.txt"

[Config Medium]
description = "Ring routing with 16 clients"
RingNetwork.N = 16
RingNetwork.K = 128
RingNetwork.X = 32
RingNetwork.topoFile = "config_16.txt"

[Config Large]
description = "Ring routing with 32 clients"
RingNetwork.N = 32
RingNetwork.K = 256
RingNetwork.X = 64
RingNetwork.topoFile = "config_32.txt"

[Config Custom]
description = "Custom ring configuration"
RingNetwork.N = ${N=8,16,32}
RingNetwork.K = ${K=64,128,256}
RingNetwork.X = ${X=16,32,64}
RingNetwork.topoFile = "config.txt"
constraint = (${X} > ${N}) && (${K} / ${X} >= 2)
