[General]
network = ChordNetwork
sim-time-limit = 1000s
cpu-time-limit = 300s
seed-set = ${repetition}
num-rngs = 1
debug-on-errors = true
print-undisposed = true
**.vector-recording = true
**.scalar-recording = true

[Config Small]
description = "CHORD routing with 8 clients"
ChordNetwork.N = 8
ChordNetwork.K = 64
ChordNetwork.X = 16
ChordNetwork.topoFile = "config.txt"

[Config Medium]
description = "CHORD routing with 16 clients"
ChordNetwork.N = 16
ChordNetwork.K = 128
ChordNetwork.X = 32
ChordNetwork.topoFile = "config_16.txt"

[Config Large]
description = "CHORD routing with 32 clients"
ChordNetwork.N = 32
ChordNetwork.K = 256
ChordNetwork.X = 64
ChordNetwork.topoFile = "config_32.txt"

[Config Custom]
description = "Custom CHORD configuration"
ChordNetwork.N = ${N=8,16,32}
ChordNetwork.K = ${K=64,128,256}
ChordNetwork.X = ${X=16,32,64}
ChordNetwork.topoFile = "config.txt"
constraint = (${X} > ${N}) && (${K} / ${X} >= 2)
